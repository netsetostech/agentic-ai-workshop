name: checks

# Every pull request and every push to main: the lesson pages against the kit, and the kit's offline checks.
# No Google credential, no cost. The heavy kit validation (terraform validate, the image builds) runs in the
# learner repository after each publish, in its documind-dryrun workflow.
#
# PUBLISH_DENY (a repository secret, optional): your lane's project id and number, comma-separated, so the page
# checker and the publish scan refuse them too. Unset, the built-in patterns still apply.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-and-kit:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DENY: ${{ secrets.PUBLISH_DENY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # What the kit code the checks load imports: the answer contract is pydantic (shared/documind_schemas.py),
      # the tool layer calls requests, judge.py reads pandas, fetch_real.py reads pypdf. The rest is stdlib.
      - name: What the checks import
        run: pip install pydantic pandas pypdf requests

      - name: Pages - every excerpt verbatim in deploy/, every make target real, no quizzes, nothing private
        run: python pagekit/check_lesson.py

      - name: Pages - the responsive audit (phone widths, the embed, touch)
        run: python pagekit/audit_pages.py

      - name: Every Python file compiles
        run: python -m compileall -q deploy pagekit tools lessons

      - name: Lesson demos - source coverage and offline execution contracts
        run: |
          python -m pip install --no-deps -e deploy/workshop_demos/setup
          python tools/build_workshop_demos.py --check
          python tools/check_workshop_demos.py
          python -m unittest discover -s tools/tests
          python deploy/workshop_demos/tests/run_tests.py

      - name: Kit - offline regressions
        run: |
          python -m unittest discover -s deploy/commands/tests
          python -m unittest discover -s deploy/operators/tests
          python -m unittest discover -s deploy/evals/tests

      # The chat brains (workshop lessons 5.1, 5.4, 5.5 and 5.7) need the chat image's own pins - LangChain, LangGraph,
      # google-adk - which the step above does not install. They get a venv of their own, so the shared interpreter
      # stays what the checks import, and DOCUMIND_REQUIRE_LIBS=1 makes a missing pin a failure, not a skip.
      # test_chat_limits.py's library half is the brains under a turn's limits (lessons 5.5 and 5.7);
      # test_cases.py's is the Desk's chat door and case routes (lesson 5.6); test_desk.py's the router and the
      # desk graph (lesson 10.4); test_gchat.py's the Google Chat bridge and the Desk's delegation rules (10.4);
      # test_agent_bench.py's the agent bench's patterns on a scripted model (lessons 10.1-10.3 and 10.5);
      # test_agent_patterns.py's lesson 10.1's two, prompted ReAct parsed by code and the plan-first loop.
      # test_agent_plans.py's lesson 10.2's two, plan-and-execute with one replan and plan-once (ReWOO) in waves.
      # test_agent_verify.py's lesson 10.3's verify, the figure check in code, a note before each retry, at most three.
      # test_approvals.py's a person in the loop (lesson 5.8, services/chat/approval.py), which also needs the local
      # lane's SQLite checkpointer, at the version services/chat/requirements-local.txt pins.
      # test_approval_wired.py's the approval wired into the chat service behind tenant_settings.agent_actions (lesson
      # 5.8: shared/approvals.py's records, approval_routes.py's hold and routes, reconcile.py --approved), off by default.
      # test_thread_read.py's a thread's checkpoints read back, replayed and forked (lesson 6.8).
      # test_context_sources.py's one turn's context by source on every brain, offline and counted (lesson 6.1).
      # test_probe_agent_stack.py's library half runs the agent tools/probe_agent_stack.py deploys for lesson 10.9's
      # batch 0 probe, under the same google-adk pin, on a scripted model (the authoring repo only; never published).
      # test_context_window.py's the window over a conversation, what each model call is sent of it (lesson 6.9,
      # services/chat/context_window.py, which the service does not import; make window-check).
      # test_managed_peer.py's the A2A peer staged for Agent Engine (lesson 10.9): loaded by ADK's own loader, its cap of
      # 12 model calls, and ADK's own deploy on a stand-in vertexai; a2a-sdk and mcp, which these pins lack, stand in.
      # test_spotlight.py's the fence on what the chat brains and a Desk agent read and the scrub on /v1/chat's answer
      # (lesson 10.8, shared/spotlight.py; AGENT_FENCE and AGENT_SCRUB, both off unless set to on).
      # test_handoff.py's the ADK brain's hand-off to the A2A peer (lesson 10.7) through a2a-sdk, which the chat pins.
      # test_adk_planner.py's ADK_PLANNER, ADK's own planner on the ADK brain, and an answer with no thought part in it
      # (lesson 10.2). test_agent_shapes.py's two ADK desks in a ping-pong, stopped by a transfer cap (lesson 10.7).
      # test_case_room.py's the Case Room (after Module 10, Phase 1): one full and final case carried by a team of
      # agents on a typed board, offline, its three arms on a scripted model (commands/case_room.py; make case-eval).
      - name: Kit - the chat brains, in the chat image's pins
        working-directory: deploy
        run: |
          python -m venv /tmp/chat-venv
          /tmp/chat-venv/bin/pip install -q -r services/chat/requirements.txt
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_chat_brains.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_chat_limits.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_model_quota.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_cases.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_desk.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_gchat.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_bench.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_patterns.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_plans.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_verify.py -v
          /tmp/chat-venv/bin/pip install -q "$(grep -E '^langgraph-checkpoint-sqlite==' services/chat/requirements-local.txt)"
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_approvals.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_approval_wired.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_thread_read.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_context_sources.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest discover -s ../tools/tests -p test_probe_agent_stack.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_context_window.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_managed_peer.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_spotlight.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_handoff.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_adk_planner.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_shapes.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_case_room.py -v
          /tmp/chat-venv/bin/pip install -q "$(grep -E '^PyJWT' services/frontend/requirements.txt)"   # the UI's own pin, for its IAP check
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_ui_auth.py -v

      # The A2A peer (workshop lessons 10.6-10.8) runs its own image's pins - google-adk with its a2a and mcp extras,
      # a2a-sdk's server - which no step above installs. They get a venv of their own, from services/agent/requirements.txt,
      # plus fastmcp==3.4.7 (the kit's MCP server's pin, which the tool-pins drill lists tools with), and
      # DOCUMIND_REQUIRE_LIBS=1 makes a missing pin a failure, not a skip. test_a2a_peer.py's library half is the kit's
      # agent.py over its own to_a2a with the delegation chain (lesson 10.7, services/agent/chain.py) off and on;
      # test_pins.py's is the tool pins (lesson 10.8, services/agent/pins.py) against the kit's agent and evil_mcp.py.
      # test_attack_agents.py's is make mcp-local (lesson 10.8): the kit's MCP server in the local profile, listed over
      # the MCP wire with no token and answering in process over acme's chunks; its stdlib half runs make attack-agents'.
      - name: Kit - the A2A peer, in the peer image's pins
        working-directory: deploy
        run: |
          python -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/pip install -q -r services/agent/requirements.txt
          /tmp/agent-venv/bin/pip install -q "fastmcp==3.4.7"
          DOCUMIND_REQUIRE_LIBS=1 /tmp/agent-venv/bin/python -m unittest commands/tests/test_a2a_peer.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/agent-venv/bin/python -m unittest commands/tests/test_pins.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/agent-venv/bin/python -m unittest commands/tests/test_attack_agents.py -v

      # Model Armor's verdict (workshop lesson 4.8): test_guard_verdict.py builds google-cloud-modelarmor's own response
      # types, so it needs the library, at the version services/rag-api/requirements.txt pins. The shared interpreter
      # skips it; this venv holds the pin alone, and DOCUMIND_REQUIRE_LIBS=1 makes a missing library a failure.
      - name: Kit - Model Armor's verdict, in rag-api's pin
        working-directory: deploy
        run: |
          python -m venv /tmp/armor-venv
          /tmp/armor-venv/bin/pip install -q "$(grep -E '^google-cloud-modelarmor==' services/rag-api/requirements.txt)"
          DOCUMIND_REQUIRE_LIBS=1 /tmp/armor-venv/bin/python -m unittest commands/tests/test_guard_verdict.py -v

      # It judges the golden set, not the model: every assertion could still fail, every must_retrieve anchor
      # resolves, the isolation rows are still there.
      - name: Kit - the eval gate, offline half
        run: python deploy/evals/run_eval.py

      - name: Kit - offline gates (authorization, lifecycle, retrieval, one retrieve(), the real corpus, the Rs 0 lane)
        run: |
          python tools/check_authz.py
          python tools/check_lifecycle.py
          python tools/check_retrieval.py
          python tools/check_one_retrieval.py
          python tools/check_real_corpus.py
          python tools/check_local_lane.py

      - name: Kit - deploy/INDEX.md is current
        run: python tools/kit_index.py --check

      - name: Kit - nothing private in what a publish would send
        run: python tools/publish_learner.py --check
