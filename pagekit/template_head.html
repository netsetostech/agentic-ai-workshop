<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Lesson 3.3 Ingesting - From an Upload to a Chunk You Can Search | Netsetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
/* ---------- 0. config: every size the tiers change lives here ---------- */
:root{
  color-scheme:light;
  --navy:#0f1729;--teal:#0d9488;--teal-dark:#065f46;--teal-light:#f0fdfa;--cyan:#0891b2;--slate:#334155;--slate-light:#94a3b8;--bg:#fafaf9;--card:#fff;--border:#e7e5e4;--code-bg:#0f172a;--code-text:#e2e8f0;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:'Playfair Display',Georgia,serif;
  --measure:720px;--pad-x:32px;--pad-top:40px;--pad-bottom:80px;
  --body-size:18px;--body-lh:1.65;--list-size:17px;--h2-size:26px;--h3-size:18px;--hero-lede:16.5px;--small-size:14px;--chip-size:12px;--kicker-size:10.5px;
  --code-size:14px;--code-lh:1.5;--code-pad:16px 18px;--inline-code:14px;
  --card-pad:18px 22px;--gap:14px;--step-size:48px;
  --w-media:840px;--media-gutter:24px;--touch:0px;--hint-clear:36px;--footer-bottom:28px;
  --cd-cols:minmax(0,1fr) 28px minmax(0,1.3fr) 28px minmax(0,1fr);--arrow-top:28px;
  --band-cols:repeat(auto-fit,minmax(170px,1fr));--fs-cols:minmax(0,1.5fr) minmax(0,1fr);
  --exercise-cols:repeat(auto-fill,minmax(280px,1fr));--table-size:12.5px;
}
/* ---------- 0b. global discipline (every width) ---------- */
*{box-sizing:border-box;margin:0;padding:0;}
html{background:transparent;-webkit-text-size-adjust:100%;max-width:100%;}
body{font-family:var(--font);background:transparent;color:var(--slate);font-size:var(--body-size);line-height:var(--body-lh);max-width:100%;overflow-x:clip;display:flow-root;}
@supports not (overflow:clip){body{overflow-x:hidden;}}
img,svg,video,canvas{max-width:100%;height:auto;}
iframe{max-width:100%;}
table{max-width:100%;}
code:not(pre code){overflow-wrap:anywhere;}
a{overflow-wrap:break-word;color:var(--teal);}
h2,h3{scroll-margin-top:24px;text-wrap:balance;}
p,li{text-wrap:pretty;}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:5px;}
pre{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;}
/* ---------- 0c. the two-width breakout: no media query, vw is the embed ---------- */
.content > .cw,.content > .tw,.content > .diagram{width:min(100vw - 2 * var(--media-gutter),var(--w-media));margin-inline:calc(50% - min(50vw - var(--media-gutter),var(--w-media) / 2));}
/* ---------- components ---------- */
.hero{background:linear-gradient(135deg,#042f2e,#065f46 30%,#0d9488 50%,var(--navy));padding:60px var(--pad-x) 56px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40%;right:-15%;width:500px;height:500px;background:radial-gradient(circle,rgba(13,148,136,.22),transparent 70%);border-radius:50%;animation:float 8s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
.hero-inner{max-width:min(100%,var(--measure));margin:0 auto;position:relative;z-index:1;}
.hero-crumb{color:#5eead4;font-size:var(--chip-size);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.hero h1{font-family:var(--display);color:#fff;font-size:clamp(26px,5vw,40px);line-height:1.18;margin-bottom:14px;}
.hero h1 span{background:linear-gradient(90deg,#2dd4bf,#5eead4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:#cbd5e1;font-size:var(--hero-lede);line-height:1.75;max-width:66ch;}
.hero-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.hero-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:4px 14px;font-size:var(--chip-size);color:#e2e8f0;}
.content{max-width:min(100%,var(--measure));margin:0 auto;padding:var(--pad-top) max(var(--pad-x),env(safe-area-inset-right)) var(--pad-bottom) max(var(--pad-x),env(safe-area-inset-left));}
h2{font-family:var(--display);font-size:var(--h2-size);color:var(--navy);margin:52px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--teal);}
h3{font-size:var(--h3-size);color:var(--navy);margin:28px 0 10px;font-weight:700;}
h4{font-size:var(--list-size);color:var(--navy);margin:22px 0 8px;font-weight:700;}
p{margin-bottom:14px;}
strong{color:var(--navy);}
code:not(pre code){font-family:var(--mono);font-size:var(--inline-code);background:var(--teal-light);padding:2px 6px;border-radius:4px;color:var(--teal);}
ol,ul{margin:0 0 14px;padding-left:22px;font-size:var(--list-size);}
li{margin-bottom:6px;}
.kicker{display:block;font-family:var(--mono);font-size:var(--kicker-size);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin-bottom:4px;}
.toc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:var(--card-pad);margin:0 0 10px;}
.toc-title{font-family:var(--mono);font-size:var(--kicker-size);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin-bottom:8px;}
.toc ol{margin:0;padding-left:22px;font-size:var(--small-size);}
.toc a{color:var(--navy);text-decoration:none;display:inline-block;min-height:var(--touch);line-height:1.5;padding:4px 0;}
.step{display:flex;gap:14px;margin:44px 0 10px;align-items:center;}
.step-n{min-width:var(--step-size);width:var(--step-size);height:var(--step-size);background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--h3-size);flex-shrink:0;box-shadow:0 4px 14px rgba(13,148,136,.3);}
.step h3{margin:0;font-size:var(--h2-size);font-family:var(--display);}
.step p{margin:2px 0 0;font-size:var(--small-size);color:var(--slate-light);}
.box{border-radius:12px;padding:var(--card-pad);margin:20px 0;font-size:var(--small-size);line-height:1.7;}
.box-title{font-weight:700;margin-bottom:6px;}
.box-teal{background:var(--teal-light);border-left:4px solid var(--teal);}.box-teal .box-title{color:#134e4a;}
.box-amber{background:#fffbeb;border-left:4px solid #f59e0b;}.box-amber .box-title{color:#92400e;}
.box-red{background:#fef2f2;border-left:4px solid #ef4444;}.box-red .box-title{color:#991b1b;}
.box p{margin:0 0 8px;font-size:var(--small-size);}
.box ul,.box ol{margin:6px 0 0;padding-left:18px;font-size:var(--small-size);}
.analogy{display:flex;gap:14px;padding:var(--card-pad);background:linear-gradient(135deg,#f0fdfa,#ccfbf1);border:1px solid #99f6e4;border-radius:14px;margin:20px 0;font-size:var(--small-size);}
.analogy-icon{font-size:28px;flex-shrink:0;}
.analogy p{margin:0 0 6px;line-height:1.65;color:#134e4a;font-size:var(--small-size);}
.analogy strong{color:#065f46;}
.wjh{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #bbf7d0;border-radius:12px;padding:var(--card-pad);margin:18px 0;font-size:var(--small-size);line-height:1.7;}
.wjh-title{font-weight:700;color:#166534;margin-bottom:6px;}
.wjh p{margin:0 0 6px;font-size:var(--small-size);}
/* code windows: the rounded shell and the scroller are two elements */
.cw{position:relative;margin:18px 0;border-radius:12px;overflow:hidden;border:1px solid #1e293b;background:var(--code-bg);}
.ch-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1e293b;padding:7px 14px;font-family:var(--mono);font-size:var(--chip-size);color:var(--slate-light);}
.ch-bar span{overflow-wrap:anywhere;}
.cp{background:0;border:1px solid #475569;color:#94a3b8;padding:3px 10px;border-radius:5px;font-family:var(--mono);font-size:var(--chip-size);cursor:pointer;min-height:max(34px,var(--touch));min-width:max(34px,var(--touch));-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.cp.copied{background:var(--teal-dark);border-color:var(--teal);color:#fff;}
.cp:active{transform:scale(.96);}
.cw pre{background:var(--code-bg);color:var(--code-text);padding:var(--code-pad);font-family:var(--mono);font-size:var(--code-size);line-height:var(--code-lh);margin:0;}
.cw.is-scroll > pre{padding-bottom:var(--hint-clear);}
.scroll-hint{position:absolute;right:10px;bottom:8px;z-index:2;pointer-events:none;font-family:var(--mono);font-size:var(--kicker-size);font-weight:700;letter-spacing:.8px;background:rgba(15,23,41,.86);color:#a5f3fc;padding:3px 8px;border-radius:20px;opacity:0;transition:opacity .3s;}
.is-scroll > .scroll-hint{opacity:1;}
.is-scroll.scrolled > .scroll-hint{opacity:0;}
.kw{color:#c084fc;}.fn{color:#67e8f9;}.st{color:#86efac;}.cm{color:#94a3b8;font-style:italic;}.nu{color:#93c5fd;}
/* tables: a scroll wrapper on wide screens, cards on phones */
.tw{position:relative;margin:20px 0;}
.tw-scroll{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border);background:var(--card);}
.tw.is-scroll .tw-scroll{padding-bottom:var(--hint-clear);}
.comp-table{width:100%;border-collapse:collapse;font-size:var(--table-size);}
.comp-table thead{background:var(--navy);color:#fff;}
.comp-table th,.comp-table td{padding:10px 12px;text-align:left;vertical-align:top;line-height:1.5;}
.comp-table tbody tr:nth-child(even){background:var(--teal-light);}
.comp-table tbody td{border-bottom:1px solid var(--border);}
.comp-table code:not(pre code){font-size:var(--table-size);padding:1px 5px;}
/* diagrams: DOM boxes, so they re-stack on a phone instead of shrinking */
.diagram{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:var(--card-pad);margin:24px 0;}
.dg-title{font-family:var(--mono);font-size:var(--kicker-size);letter-spacing:1.2px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:12px;}
.dg-cap{font-size:var(--small-size);color:var(--slate);margin:12px 0 0;line-height:1.6;}
.cd{display:grid;grid-template-columns:var(--cd-cols);gap:var(--gap);align-items:start;}
.lane{display:flex;flex-direction:column;gap:8px;}
.lane-h{font-size:var(--kicker-size);font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);}
.node{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:var(--small-size);line-height:1.5;}
.node b{display:block;color:var(--navy);font-family:var(--mono);font-size:var(--small-size);}
.node.code{border-color:#99f6e4;background:var(--teal-light);}
.node.hub{border:2px solid var(--teal);background:var(--card);box-shadow:0 6px 18px rgba(13,148,136,.15);}
.node.job{border-style:dashed;}
.cd-arrow{display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:24px;font-weight:700;padding-top:var(--arrow-top);}
.cd-wide{grid-column:1 / -1;}
.band{display:grid;grid-template-columns:var(--band-cols);gap:8px;}
.down{display:flex;justify-content:center;color:var(--teal);font-size:24px;font-weight:700;margin:6px 0;}
.spine{display:flex;flex-direction:column;gap:8px;}
.fs{display:grid;grid-template-columns:var(--fs-cols);gap:8px;align-items:start;}
.fs-main{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:var(--small-size);line-height:1.5;}
.fs-n{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono);font-size:var(--small-size);}
.fs-branch{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:var(--small-size);line-height:1.5;color:#78350f;}
.fs-branch b{color:#92400e;}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:var(--small-size);margin-top:12px;}
.legend span::before{content:'';display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--border);background:var(--card);}
.legend .l-code::before{background:var(--teal-light);border-color:#99f6e4;}
.legend .l-job::before{border-style:dashed;}
.legend .l-branch::before{background:#fffbeb;border-color:#fde68a;}
/* quiz */
.quiz{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:var(--card-pad);margin:18px 0;}
.quiz-q{font-weight:700;color:var(--navy);margin-bottom:10px;font-size:var(--list-size);}
.quiz-opts{display:grid;gap:8px;}
.quiz-opt{text-align:left;font:inherit;font-size:var(--small-size);line-height:1.45;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--slate);cursor:pointer;min-height:var(--touch);}
.quiz-opt:active{transform:scale(.99);}
.quiz-opt.ok{background:#dcfce7;border-color:#16a34a;color:#166534;}
.quiz-opt.no{background:#fee2e2;border-color:#ef4444;color:#991b1b;}
.quiz-opt:disabled{cursor:default;}
.quiz-fb{margin-top:10px;font-size:var(--small-size);color:var(--teal-dark);line-height:1.6;}
/* exercises */
.exercise-grid{display:grid;grid-template-columns:var(--exercise-cols);gap:var(--gap);margin:18px 0;}
.exercise-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:var(--card-pad);}
.exercise-diff{font-size:var(--kicker-size);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:8px;}
.d-easy{background:#d1fae5;color:#065f46;}.d-med{background:#fef3c7;color:#92400e;}.d-hard{background:#fce7f3;color:#9d174d;}
.exercise-card h4{margin:0 0 6px;font-size:var(--small-size);}
.exercise-card p{font-size:var(--small-size);margin:0;}
.footer{text-align:center;padding:28px var(--pad-x) var(--footer-bottom);color:var(--slate-light);font-size:var(--chip-size);border-top:1px solid var(--border);margin-top:36px;}
/* ---------- 1. the phone tier: same names, phone values, then structure only ---------- */
@media (max-width: 640px){
  :root{--measure:100%;--pad-x:14px;--pad-top:22px;--pad-bottom:34px;
    --body-size:17px;--body-lh:1.68;--list-size:16px;--h2-size:20px;--h3-size:16px;--hero-lede:15px;--small-size:14px;--chip-size:12.5px;--kicker-size:11px;
    --code-size:13px;--code-lh:1.55;--code-pad:12px 13px;--inline-code:13.5px;
    --card-pad:14px 15px;--gap:12px;--step-size:40px;
    --w-media:100vw;--media-gutter:0px;--touch:44px;--hint-clear:36px;--footer-bottom:104px;
    --cd-cols:minmax(0,1fr);--arrow-top:0px;--band-cols:minmax(0,1fr);--fs-cols:minmax(0,1fr);--exercise-cols:minmax(0,1fr);--table-size:13px;}
  *{min-width:0;}
  .hero::before{display:none;}
  .hero h1{font-size:clamp(21px,6.3vw,26px);line-height:1.22;}
  .hero p{max-width:100%;}
  .step{flex-direction:column;align-items:flex-start;gap:8px;}
  .cd-arrow{transform:rotate(90deg);}
  .cd-wide{grid-column:auto;}
  .tw-scroll{overflow:visible;border:0;border-radius:0;background:transparent;}
  .comp-table,.comp-table thead,.comp-table tbody,.comp-table tr,.comp-table th,.comp-table td{display:block;}
  .comp-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
  .comp-table tbody tr{border:1px solid var(--border);border-radius:10px;margin:0 0 10px;background:var(--card);padding:4px 0;}
  .comp-table tbody tr:nth-child(even){background:var(--card);}
  .comp-table tbody td{border-bottom:1px dashed var(--border);}
  .comp-table tbody td:last-child{border-bottom:0;}
  .comp-table tbody td::before{content:attr(data-label);display:block;font-family:var(--mono);font-size:var(--kicker-size);font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#0e7490;margin-bottom:3px;}
  .comp-table tbody td:first-child::before{display:none;}
  .comp-table tbody td:first-child{font-weight:700;color:var(--navy);}
  input,select,textarea{font-size:16px;}
}
/* mobile-patch-v1 - small phones: config nudges only, no new structure */
@media (max-width: 380px){
  :root{--pad-x:11px;--h2-size:18.5px;--code-size:12.5px;--code-pad:10px 11px;--step-size:36px;--table-size:12.5px;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
/* hover only where a real pointer exists: a tapped option must not latch */
@media (hover:hover) and (pointer:fine){
  .cp:hover{background:#334155;color:#e2e8f0;}
  .quiz-opt:hover:not(:disabled){background:var(--teal-light);border-color:var(--teal);}
  .exercise-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .toc a:hover{text-decoration:underline;}
}
@media (hover:none){
  button,summary,a,.quiz-opt{-webkit-tap-highlight-color:rgba(13,148,136,.18);}
}
@media (forced-colors: active){
  .hero h1 span{-webkit-text-fill-color:currentColor;background:none;color:CanvasText;}
  .cp,.node,.quiz-opt,.exercise-card,.fs-main,.fs-branch{border:1px solid CanvasText;}
}
@media print{
  .scroll-hint,.cp,.toc{display:none!important;}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .content{max-width:100%;padding:0;}
  pre{white-space:pre-wrap;word-break:break-word;font-size:9px;}
  .node,.quiz,.exercise-card,.comp-table tr,.fs,.box,.wjh{break-inside:avoid;}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:8px;color:#555;}
}
</style>
</head>
<body>
