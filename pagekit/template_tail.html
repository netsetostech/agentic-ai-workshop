<script>
(function(){
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* copy buttons */
  Array.prototype.forEach.call(document.querySelectorAll('.cp'), function(btn){
    btn.addEventListener('click', function(){
      var cw = btn.closest('.cw'), pre = cw && cw.querySelector('pre');
      if(!pre) return;
      var text = pre.innerText;
      function done(){ btn.textContent = 'copied'; btn.classList.add('copied');
        setTimeout(function(){ btn.textContent = 'copy'; btn.classList.remove('copied'); }, reduce ? 1 : 1400); }
      function fallback(){ var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'absolute'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); done(); }catch(e){} document.body.removeChild(ta); }
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); }
      else fallback();
    });
  });

  /* quizzes: one answer per question, announced */
  Array.prototype.forEach.call(document.querySelectorAll('.quiz'), function(q){
    var opts = q.querySelectorAll('.quiz-opt'), fb = q.querySelector('.quiz-fb'), answered = false;
    Array.prototype.forEach.call(opts, function(opt){
      opt.addEventListener('click', function(){
        if(answered) return; answered = true;
        var ok = opt.getAttribute('data-ok') === '1';
        opt.classList.add(ok ? 'ok' : 'no');
        Array.prototype.forEach.call(opts, function(o){ if(o.getAttribute('data-ok') === '1') o.classList.add('ok'); o.disabled = true; });
        fb.textContent = (ok ? 'Correct. ' : 'Not quite. ') + (opt.getAttribute('data-fb') || '');
      });
    });
  });

  /* SWIPE hints: only on real overflow, retired once used */
  var boxes = document.querySelectorAll('.cw, .tw');
  function wire(box){
    var sc = box.classList.contains('cw') ? box.querySelector('pre') : box.querySelector('.tw-scroll');
    if(!sc) return;
    box._sync = function(){ box.classList.remove('is-scroll', 'scrolled');
      if(sc.scrollWidth - sc.clientWidth > 12) box.classList.add('is-scroll'); };
    sc.addEventListener('scroll', function(){ box.classList.add('scrolled'); }, {passive:true});
    box._sync();
  }
  Array.prototype.forEach.call(boxes, wire);
  function resync(){ Array.prototype.forEach.call(boxes, function(b){ if(b._sync) b._sync(); }); }

  /* the host scrolls; the embed cannot. Anchors and keyboard focus ask it to. */
  function hostScrollTo(el){
    if(!el || self === top) return;
    try{ parent.postMessage({type:'netsetos-scroll-to', top: el.getBoundingClientRect().top + (window.pageYOffset || 0)}, '*'); }catch(e){}
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if(!a) return;
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if(el) setTimeout(function(){ hostScrollTo(el); }, 30);
  }, true);
  document.addEventListener('focusin', function(e){
    if(e.target && e.target.getBoundingClientRect && e.target !== document.body) hostScrollTo(e.target);
  }, true);

  /* auto-height handshake: measure the body box, overshoot, debounce, post to the host */
  var lastH = 0, lastW = window.innerWidth;
  function post(h){ if(self !== top){ try{ parent.postMessage({type:'netsetos-embed-height', height:h}, '*'); }catch(e){} } }
  function ph(){
    var b = document.body, cs = getComputedStyle(b);
    var h = Math.ceil(b.getBoundingClientRect().height + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0)) + 4;
    if(!(h > 0) || Math.abs(h - lastH) < 2) return;
    lastH = h; post(h);
  }
  window.addEventListener('load', function(){ resync(); ph(); });
  window.addEventListener('resize', function(){
    if(window.innerWidth !== lastW){ lastW = window.innerWidth; resync(); }   /* the Android URL bar fires resize with no width change */
    ph();
  }, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ resync(); ph(); }, 260); });
  document.addEventListener('click', function(){ setTimeout(ph, 140); }, true);
  if(window.ResizeObserver) new ResizeObserver(ph).observe(document.body); else setInterval(ph, 1500);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ resync(); ph(); });
  [120, 400, 1000, 2500].forEach(function(t){ setTimeout(ph, t); });
  if(document.readyState !== 'loading') ph(); else document.addEventListener('DOMContentLoaded', ph);
})();
</script>
</body>
