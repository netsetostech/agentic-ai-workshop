[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-workshop-helpers"
version = "0.2.0"
description = "IDE-runnable demos for the complete DocuMind workshop"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = [
  "google-auth[requests]>=2,<3",
  "google-cloud-firestore==2.30.0",
  "google-cloud-storage==3.13.1",
  "google-cloud-aiplatform==1.153.1",
  "google-cloud-discoveryengine==0.13.11",
  "google-genai==2.22.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workshop_helpers*"]

[tool.setuptools.package-data]
workshop_helpers = ["*.sh"]
