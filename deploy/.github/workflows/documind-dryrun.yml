name: DocuMind dry run (Tier A)

# Offline validation of the DocuMind kit. No GCP credentials, no cost: every Python file compiles, the offline
# regression suites, terraform validate, the requirements, pins and Dockerfile checks, the service images
# build, and the offline half of the eval gate. This is the "will the live session hold together" gate; it
# must be green before a live session.
#
# This repository is generated from deploy/ in the private authoring repository, so the kit is the repository
# root here. The live rehearsal (terraform apply, a real deploy, the smoke tests) is deliberately not here: it
# costs money and needs a project. Run it with the Makefile (make plan / up / smoke / down). See README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tier-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # What the checks import, directly or through the kit code they load: the answer contract is pydantic
      # (shared/documind_schemas.py), the tool layer calls requests (shared/documind_tools.py), judge.py reads
      # pandas, fetch_real.py reads pypdf. Everything else they need is the standard library.
      - name: The checks' imports
        run: pip install pydantic pandas pypdf requests

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: tflint (optional lint)
        uses: terraform-linters/setup-tflint@v4
        continue-on-error: true

      - name: CI has the required build tools
        run: |
          terraform version
          docker version

      - name: All Python files compile
        run: python -m compileall -q .

      - name: IDE lesson session regressions (offline)
        run: |
          python -m pip install --no-deps -e workshop_demos/setup
          python workshop_demos/tests/run_tests.py

      - name: Command regressions (offline)
        run: python -m unittest discover -s commands/tests -v

      - name: Operator regressions (offline)
        run: python -m unittest discover -s operators/tests -v

      - name: Corpus recovery regressions (offline)
        run: python -m unittest discover -s evals/tests -v

      # The chat brains (workshop lessons 5.1, 5.4, 5.5 and 5.7) need the chat image's own pins - LangChain, LangGraph,
      # google-adk - which the checks above do not install. They get a venv of their own, so nothing above changes,
      # and DOCUMIND_REQUIRE_LIBS=1 makes a missing pin a failure rather than a skipped test. test_chat_limits.py's
      # library half is the brains under a turn's limits (workshop lessons 5.5 and 5.7); make limits-check runs
      # the same. test_cases.py's is the Desk's chat door and case routes (workshop lesson 5.6; make desk-check),
      # test_desk.py's the router and the desk graph (workshop lesson 10.4), test_gchat.py's the Google Chat bridge and
      # the Desk's delegation rules (workshop lesson 10.4), test_agent_bench.py's the agent bench's patterns on a
      # scripted model (workshop lessons 10.1-10.3 and 10.5; make agent-tests), test_agent_patterns.py's workshop
      # lesson 10.1's two, prompted ReAct parsed by code and the plan-first loop (make agent-tests),
      # test_agent_plans.py's workshop lesson 10.2's two, plan-and-execute with one replan and plan-once (ReWOO) in
      # waves (make agent-tests), test_agent_verify.py's workshop lesson 10.3's verify, the figure check in code and a
      # note before each retry, at most three attempts (make agent-tests), and
      # test_approvals.py's a person in the loop (workshop lesson 5.8, services/chat/approval.py; make approval-check),
      # which also needs the local lane's SQLite checkpointer, at the version services/chat/requirements-local.txt pins;
      # test_approval_wired.py's the approval wired into the chat service behind tenant_settings.agent_actions (workshop
      # lesson 5.8: shared/approvals.py's records, approval_routes.py's hold and routes, reconcile.py --approved), off by default;
      # test_thread_read.py's a thread's checkpoints read back, replayed and forked (workshop lesson 6.8);
      # test_context_window.py's the window over a conversation, what each model call is sent of it (workshop lesson 6.9,
      # services/chat/context_window.py, which the service does not import; make window-check).
      # test_context_sources.py's one turn's context by source on every brain, offline and counted (workshop lesson 6.1).
      # test_managed_peer.py's the A2A peer staged for Agent Engine (workshop lesson 10.9): loaded by ADK's own loader,
      # its cap of 12 model calls, and ADK's own deploy on a stand-in vertexai; a2a-sdk and mcp, which these pins lack,
      # stand in.
      # test_spotlight.py's the fence on what the chat brains and a Desk agent read and the scrub on /v1/chat's answer
      # (workshop lesson 10.8, shared/spotlight.py; AGENT_FENCE and AGENT_SCRUB, both off unless set to on).
      # test_handoff.py's the ADK brain's hand-off to the A2A peer (workshop lesson 10.7) through a2a-sdk, which the
      # chat image pins.
      # test_adk_planner.py's ADK_PLANNER, ADK's own planner on the ADK brain, and an answer with no thought part in it
      # (workshop lesson 10.2). test_agent_shapes.py's two ADK desks in a ping-pong, stopped by a transfer cap
      # (workshop lesson 10.7; make agent-shapes OFFLINE=1). test_case_room.py's the Case Room (after Module 10):
      # one full and final case carried by a team of agents on a typed board, offline (make case-eval).
      - name: Chat brain regressions, in the chat image's pins (offline)
        run: |
          python -m venv /tmp/chat-venv
          /tmp/chat-venv/bin/pip install -q -r services/chat/requirements.txt
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_chat_brains.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_chat_limits.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_cases.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_desk.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_gchat.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_bench.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_patterns.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_plans.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_verify.py -v
          /tmp/chat-venv/bin/pip install -q "$(grep -E '^langgraph-checkpoint-sqlite==' services/chat/requirements-local.txt)"
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_approvals.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_approval_wired.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_thread_read.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_context_sources.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_context_window.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_managed_peer.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_spotlight.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_handoff.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_adk_planner.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_agent_shapes.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/chat-venv/bin/python -m unittest commands/tests/test_case_room.py -v

      # The A2A peer (workshop lessons 10.6-10.8) runs its own image's pins - google-adk with its a2a and mcp extras,
      # a2a-sdk's server - which no step above installs. They get a venv of their own, from services/agent/requirements.txt,
      # plus fastmcp==3.4.7 (the kit's MCP server's pin, which the tool-pins drill lists tools with), and
      # DOCUMIND_REQUIRE_LIBS=1 makes a missing pin a failure rather than a skipped test. test_a2a_peer.py's library half
      # is the kit's agent.py over its own to_a2a with the delegation chain (workshop lesson 10.7,
      # services/agent/chain.py) off and on; test_pins.py's is the tool pins (workshop lesson 10.8,
      # services/agent/pins.py) against the kit's agent and evals/adversarial/evil_mcp.py. test_attack_agents.py's is
      # make mcp-local (workshop lesson 10.8): the kit's MCP server in the local profile, listed over the MCP wire with
      # no token and answering in process over acme's chunks; its stdlib half runs make attack-agents' script.
      - name: A2A peer regressions, in the peer image's pins (offline)
        run: |
          python -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/pip install -q -r services/agent/requirements.txt
          /tmp/agent-venv/bin/pip install -q "fastmcp==3.4.7"
          DOCUMIND_REQUIRE_LIBS=1 /tmp/agent-venv/bin/python -m unittest commands/tests/test_a2a_peer.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/agent-venv/bin/python -m unittest commands/tests/test_pins.py -v
          DOCUMIND_REQUIRE_LIBS=1 /tmp/agent-venv/bin/python -m unittest commands/tests/test_attack_agents.py -v

      - name: Extraction check (a kit-only checkout has no notebooks, so it reports and passes)
        run: python extract_documind.py --check

      - name: Tier-A offline validation (terraform validate and docker build run here)
        run: python validate.py

      # The eval gate, offline half. It judges the GOLDEN SET, not the model: that every assertion could still
      # fail, that every must_retrieve anchor resolves, and that the isolation rows are still there. No
      # credentials, so it runs on every push. The live half needs a deployment and runs from documind-cd.yml.
      - name: Eval gate (offline)
        run: python evals/run_eval.py
